name: Build Windows Installer & Portable Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      lite:
        description: "Build Python-only lite installer (skip Node/TinyCC/OpenJDK/Kotlin)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build Tran.IDE II Portable & Setup.exe
        shell: pwsh
        run: |
          if ("${{ inputs.lite }}" -eq "true") {
            python scripts/build_installer.py --lite
          } else {
            python scripts/build_installer.py
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tran-ide-ii-windows
          path: |
            dist/*.exe
            dist/*.zip

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
          generate_release_notes: true
